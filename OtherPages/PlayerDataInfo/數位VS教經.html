    <div class="main-Title-ColorLayout">
        <div class="main-Title-layout">
            <h1 class="main-Schedule-Title"><a name="schedule">比賽數據查詢</a></h1>
        </div>
    </div>
    <div class="container">
        <main>
            <div id="scoreBanner" class="match-score-banner">
                <div class="score-team">數位</div>
                <div class="score-number">2 : 0</div>
                <div class="score-team" >教經</div>
            </div>

            <section class="all-players-data">
                <h2 class="main-Title1">2025 本季全隊數據總表</h2>
                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>背號</th>
                                <th>姓名</th>
                                <th>位置</th>
                                <th class="th-atk">攻擊總數</th>
                                <th class="th-atk">攻擊得分</th>
                                <th class="th-atk">攻擊失誤</th>
                                <th class="th-ser">發球Ace</th>
                                <th class="th-ser">發球失誤</th>
                                <th class="th-rec">接球總數</th>
                                <th class="th-rec">接球到位</th>
                                <th class="th-rec">接球失誤</th>
                                <th class="th-set">舉球總數</th>
                                <th class="th-set">修正次數</th>
                                <th class="th-set">舉球失誤</th>
                            </tr>
                        </thead>
                        <tbody id="allStatsBody">
                            <tr>
                                <td colspan="14" style="padding: 20px;">資料載入中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="ranking-section">
                <h2 class="main-Title1">比賽榮譽榜</h2>
                <div class="ranking-flex-container">
                    <div class="rank-card">
                        <div class="rank-header">
                            <h3>得分王</h3>
                        </div>
                        <div id="topPoints" class="rank-content"></div>
                    </div>
                    <div class="rank-card">
                        <div class="rank-header">
                            <h3>發球王</h3>
                        </div>
                        <div id="topAces" class="rank-content"></div>
                    </div>
                    <div class="rank-card">
                        <div class="rank-header">
                            <h3>防守王</h3>
                        </div>
                        <div id="topDefense" class="rank-content"></div>
                    </div>
                    <div class="rank-card">
                        <div class="rank-header">
                            <h3>舉球王</h3>
                        </div>
                        <div id="topSetting" class="rank-content"></div>
                    </div>
                    <div class="rank-card">
                        <div class="rank-header">
                            <h3>攻擊成功率</h3>
                        </div>
                        <div id="topEfficiency" class="rank-content"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>
